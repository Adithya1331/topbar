name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained (trimmed, single file)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o publish-sc

      - name: Publish framework-dependent (single file)
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish-fd

      - name: Rename artifacts
        run: |
          Move-Item publish-sc/TopBar.exe "TopBar-${{ github.ref_name }}-win-x64-selfcontained.exe"
          Move-Item publish-fd/TopBar.exe "TopBar-${{ github.ref_name }}-win-x64-framework.exe"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TopBar-*-win-x64-selfcontained.exe
            TopBar-*-win-x64-framework.exe
          generate_release_notes: true
